    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login – GDAMAGES</title>
        <link rel="stylesheet" href="{{ url_for('Modulo_login.static', filename='Style/Style_login.css') }}">

        <style>
            body {
                /* Flask renderizará esta ruta correctamente aquí */
                background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                                url("{{ url_for('Modulo_login.static', filename='Images/Fondo_login.jpg') }}");
            }
        </style>
    </head>
    <body>
        <div class="login-container">

        <div class="logo-wrapper">
                <img src="{{ url_for('static', filename='Images/Logo.png') }}" alt="Logo" class="login-logo">
            </div>

            <h2>Iniciar Sesión</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('Modulo_login.login') }}">
                <input type="text" name="username" placeholder="Usuario" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
                <a href="{{ url_for('Modulo_login.forgot_password') }}" class="link">
                    ¿Olvidaste tu contraseña?
                </a>
            </form>

            <div class="login-footer">
                G-FLEETDAMAGE &copy; 2026
            </div>
        </div>
    </body>
    </html>
