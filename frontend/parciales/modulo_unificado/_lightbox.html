{# Módulo unificado: lightbox para ampliar imágenes de la galería. #}
<!-- Lightbox para imágenes -->
<div id="lightbox" class="lightbox">
    <span class="close" data-csp-action="cerrar-lightbox">&times;</span>
    <button id="lightbox-anterior" class="lightbox-nav lightbox-nav-anterior" type="button" data-csp-action="lightbox-anterior">&lt;</button>
    <img id="lightbox-img" src="" alt="Vista ampliada">
    <button id="lightbox-siguiente" class="lightbox-nav lightbox-nav-siguiente" type="button" data-csp-action="lightbox-siguiente">&gt;</button>
</div>
